<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- ブラウザのネイティブズームを無効化するメタタグ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cycle Flow Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --border-color: #334155;
      --input-bg: #0f172a;
      --info-bg: rgba(59, 130, 246, 0.1);
      --info-text: #cbd5e1;
    }

    :root.light-mode {
      --bg-color: #f1f5f9;
      --panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --success: #059669;
      --border-color: #cbd5e1;
      --input-bg: #f8fafc;
      --info-bg: #eff6ff;
      --info-text: #334155;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      overscroll-behavior: none; /* スワイプでの戻る/進むナビゲーションを防止 */
      display: flex;
      width: 100vw;
      height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    #sidebar {
      width: 320px;
      min-width: 320px;
      flex-shrink: 0; /* 画面が狭くなってもサイドバーを潰さない（消滅防止） */
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      overflow-y: auto;
      transition: background-color 0.3s, border-color 0.3s;
    }

    #sidebar::-webkit-scrollbar { width: 6px; }
    #sidebar::-webkit-scrollbar-track { background: var(--panel-bg); }
    #sidebar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

    .panel-section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .panel-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 15px;
      font-weight: 600;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary { background-color: var(--accent); color: white; }
    .btn-primary:hover { background-color: var(--accent-hover); }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .btn-danger:hover { background-color: var(--danger); color: white; }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover { background-color: var(--border-color); }

    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: var(--text-muted);
    }
    .form-group input[type="text"],
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }
    .form-group input[type="text"]:focus,
    .form-group select:focus { border-color: var(--accent); }
    .form-group input[type="range"] { width: 100%; accent-color: var(--accent); }

    .color-picker-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(128,128,128,0.1);
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }
    .color-picker-group input[type="color"] {
      width: 32px; height: 32px; padding: 0; border: none; border-radius: 4px; background: none; cursor: pointer;
    }

    .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; }
    .checkbox-label input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

    .info-box {
      background-color: var(--info-bg);
      border-left: 3px solid var(--accent);
      padding: 10px;
      font-size: 0.8rem;
      color: var(--info-text);
      margin-bottom: 15px;
      line-height: 1.5;
      border-radius: 0 4px 4px 0;
    }

    .radio-group label {
      display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 0.85rem; color: var(--text-main);
    }
    .radio-group input[type="radio"] { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }

    .hidden { display: none !important; }

    #canvas-container {
      flex-grow: 1;
      position: relative;
      background-color: var(--bg-color);
      overflow: hidden;
      touch-action: none; /* キャンバス上でのブラウザネイティブのズームやパンを完全無効化 */
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #inline-editor {
      position: absolute;
      background-color: var(--panel-bg);
      color: var(--text-main);
      border: 2px solid var(--accent);
      border-radius: 4px;
      padding: 5px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      outline: none;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      resize: none;
      overflow: hidden;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.2;
    }

    #zoom-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 50;
    }
    #zoom-controls button {
      background: none;
      border: none;
      padding: 8px 12px;
      color: var(--text-main);
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    #zoom-controls button:hover { background-color: var(--border-color); }
    #zoom-controls span {
      padding: 8px 12px;
      font-size: 0.85rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      min-width: 60px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="panel-section" style="padding-bottom: 10px;">
      <h1 class="text-xl font-bold mb-1">Cycle Flow</h1>
      <p class="text-xs" style="color: var(--text-muted);">プロセスマイニング・シミュレーター</p>
    </div>

    <div class="panel-section">
      <div class="info-box">
        <b>基本操作:</b><br>
        ・空白[Wクリック]：拠点追加<br>
        ・文字[Wクリック]：直接編集 (Shift+Enterで改行)<br>
        ・[Shift+ドラッグ]：線を引く<br>
        ・線の端(●)ドラッグ：付け替え<br>
        ・[ホイール回転]：拡大縮小
      </div>
      
      <div class="form-group" style="padding: 10px; background: rgba(128,128,128,0.1); border-radius: 4px;">
        <label>背景のドラッグ操作</label>
        <div class="radio-group" style="display: flex; gap: 12px; margin-top: 8px;">
          <label title="左クリックしたまま画面を移動します">
            <input type="radio" name="bg-drag-mode" value="pan" checked> ✋ 画面移動
          </label>
          <label title="左クリックしたまま範囲を囲んで選択します">
            <input type="radio" name="bg-drag-mode" value="select"> 🔲 範囲選択
          </label>
        </div>
      </div>

      <button id="btn-toggle-sim" class="btn btn-primary mb-3 mt-2">
        ▶ シミュレーション開始
      </button>

      <div class="form-group">
        <label>発生頻度: <span id="val-spawn">中</span></label>
        <input type="range" id="slider-spawn" min="10" max="120" value="60">
      </div>
      <div class="form-group">
        <label>基本速度: <span id="val-speed">1.0x</span></label>
        <input type="range" id="slider-speed" min="0.1" max="5.0" step="0.1" value="1.0">
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">表示設定</div>
      <div class="form-group">
        <label>テーマカラー</label>
        <select id="select-theme">
          <option value="dark">ダークモード (Dark)</option>
          <option value="light">ライトモード (Light)</option>
        </select>
      </div>
      <div class="form-group" style="padding: 10px; background: rgba(128,128,128,0.1); border-radius: 4px;">
        <label class="checkbox-label">
          <input type="checkbox" id="check-enable-glow" checked>
          <span>ネオン・陰影効果 (Glow)</span>
        </label>
        <label class="checkbox-label" style="margin-top: 8px;">
          <input type="checkbox" id="check-snap" checked>
          <span>整列アシスト (スマートガイド)</span>
        </label>
        <label class="checkbox-label" style="margin-top: 8px;">
          <input type="checkbox" id="check-show-badge" checked>
          <span>滞留カウント(バッジ)を表示</span>
        </label>
      </div>
    </div>

    <div id="no-selection" class="panel-section" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
      拠点 または 線 をクリックすると<br>詳細を設定できます
    </div>

    <div id="node-properties" class="panel-section hidden" style="flex-grow: 1;">
      <div class="panel-title">拠点の設定</div>
      <div class="form-group">
        <label>形状</label>
        <select id="select-node-shape">
          <option value="circle">丸 (Circle)</option>
          <option value="rect">四角 (Rectangle)</option>
          <option value="diamond">菱形 (Diamond)</option>
        </select>
      </div>
      <div class="form-group">
        <label>サイズ: <span id="val-node-scale" style="color: var(--accent); font-weight: bold;">1.0x</span></label>
        <input type="range" id="slider-node-scale" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="form-group">
        <label>テーマカラー</label>
        <div class="color-picker-group">
          <input type="color" id="input-node-color" value="#ef4444">
          <label class="checkbox-label" style="margin-bottom: 0;">
            <input type="checkbox" id="check-node-color">
            <span style="font-size: 0.85rem;">色を指定する</span>
          </label>
        </div>
      </div>
      <div class="form-group" style="margin-top: 15px; padding: 10px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 4px;">
        <label class="checkbox-label" style="color: var(--success);">
          <input type="checkbox" id="check-is-goal">
          <span class="font-bold">この拠点を「ゴール」にする</span>
        </label>
      </div>
      <div style="margin-top: auto; padding-top: 20px;">
        <button id="btn-delete-node" class="btn btn-danger">拠点を削除 (Del)</button>
      </div>
    </div>

    <div id="edge-properties" class="panel-section hidden" style="flex-grow: 1;">
      <div class="panel-title">線の設定</div>
      <div class="form-group" style="margin-bottom: 20px; padding: 12px; background: rgba(128,128,128,0.1); border-radius: 6px; border: 1px solid var(--border-color);">
        <label>玉の通過速度: <span id="val-edge-speed" style="color: var(--accent); font-weight: bold;">1.0x</span></label>
        <input type="range" id="slider-edge-speed" min="0.1" max="3.0" step="0.1" value="1.0">
        
        <label style="margin-top: 10px;">1回の発生量: <span id="val-edge-volume" style="color: var(--accent); font-weight: bold;">1個</span></label>
        <input type="range" id="slider-edge-volume" min="1" max="10" step="1" value="1">
      </div>
      <div class="form-group">
        <label>テーマカラー</label>
        <div class="color-picker-group">
          <input type="color" id="input-edge-color" value="#ef4444">
          <label class="checkbox-label" style="margin-bottom: 0;">
            <input type="checkbox" id="check-edge-color">
            <span style="font-size: 0.85rem;">色を指定する</span>
          </label>
        </div>
      </div>
      <div style="margin-top: auto; padding-top: 20px;">
        <button id="btn-delete-edge" class="btn btn-danger">この線を削除 (Del)</button>
      </div>
    </div>

    <div id="multi-selection-properties" class="panel-section hidden" style="flex-grow: 1;">
      <div class="panel-title">複数選択中</div>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">
        <span id="multi-sel-count" style="font-weight:bold; color: var(--text-main);">0</span> 個の拠点が選択されています。
      </p>
      <div style="margin-top: auto; padding-top: 20px;">
        <button id="btn-delete-multi" class="btn btn-danger">まとめて削除 (Del)</button>
      </div>
    </div>

    <div class="panel-section" style="border-bottom: none; padding-bottom: 10px;">
      <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button id="btn-save" class="btn btn-secondary" style="flex: 1; font-size: 0.8rem;">保存</button>
        <button id="btn-load" class="btn btn-secondary" style="flex: 1; font-size: 0.8rem;">読込</button>
        <input type="file" id="file-input" accept=".json" style="display: none;">
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="btn-screenshot" class="btn btn-secondary" style="flex: 1; font-size: 0.8rem;" title="画像を保存">📷 スクショ</button>
        <button id="btn-record" class="btn btn-secondary" style="flex: 1; font-size: 0.8rem;" title="動画を録画">🎥 録画開始</button>
      </div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="sim-canvas"></canvas>
    <textarea id="inline-editor" class="hidden"></textarea>
    
    <div id="zoom-controls">
      <button id="btn-zoom-out" title="縮小">－</button>
      <span id="zoom-level">100%</span>
      <button id="btn-zoom-in" title="拡大">＋</button>
      <button id="btn-zoom-reset" title="全体表示">🎯</button>
    </div>
  </div>

  <script>
    const state = {
      nodes: [],
      edges: [],
      signals: [],
      isRunning: false,
      simulationSpeed: 1.0,
      spawnRate: 60,
      frameCount: 0,
      
      selectedNode: null,
      selectedEdge: null,
      selectedGroup: [], 
      
      isDragging: false,
      draggedNode: null,
      dragOffsetX: 0,
      dragOffsetY: 0,
      
      isDraggingLabel: false,
      draggedLabelEdge: null,

      isDraggingEdgeHandle: false,
      draggedEdgeHandleEdge: null,
      draggedEdgeHandleType: null,
      
      isConnecting: false,
      connectFromNode: null,
      
      bgDragMode: 'pan', 
      
      isBoxSelecting: false,
      boxStartX: 0,
      boxStartY: 0,
      boxCurrentX: 0,
      boxCurrentY: 0,

      panX: 0,
      panY: 0,
      zoom: 1.0,
      isPanning: false,
      panStartX: 0,
      panStartY: 0,

      mouseX: 0,
      mouseY: 0,
      
      theme: 'dark',
      enableGlow: true,
      enableSnap: true,
      showCountBadge: true,
      
      alignGuides: [],
      lastTime: 0,

      editingTarget: null, 
      editingType: null,

      isRecording: false,
      mediaRecorder: null,
      recordedChunks: []
    };

    const THEME_COLORS = {
      dark: {
        bg: '#0f172a', nodeBg: '#334155', nodeDefaultBorder: '#475569', text: '#ffffff',
        edgeLine: 'rgba(148, 163, 184, 0.4)', edgeLabelBg: 'rgba(15, 23, 42, 0.85)', edgeLabelText: '#94a3b8',
        glowSelected: 'rgba(59, 130, 246, 0.8)', glowError: 'rgba(239, 68, 68, 0.9)', glowSuccess: 'rgba(16, 185, 129, 0.6)',
        boxSelectFill: 'rgba(59, 130, 246, 0.1)', boxSelectBorder: 'rgba(59, 130, 246, 0.8)'
      },
      light: {
        bg: '#f1f5f9', nodeBg: '#ffffff', nodeDefaultBorder: '#cbd5e1', text: '#0f172a',
        edgeLine: 'rgba(100, 116, 139, 0.5)', edgeLabelBg: 'rgba(255, 255, 255, 0.9)', edgeLabelText: '#475569',
        glowSelected: 'rgba(37, 99, 235, 0.5)', glowError: 'rgba(220, 38, 38, 0.6)', glowSuccess: 'rgba(5, 150, 105, 0.4)',
        boxSelectFill: 'rgba(37, 99, 235, 0.1)', boxSelectBorder: 'rgba(37, 99, 235, 0.8)'
      }
    };

    function getColor(key) { return THEME_COLORS[state.theme][key]; }

    const canvas = document.getElementById('sim-canvas');
    const ctx = canvas.getContext('2d');
    let bgPattern = null;

    const ui = {
      btnToggle: document.getElementById('btn-toggle-sim'),
      sliderSpawn: document.getElementById('slider-spawn'),
      valSpawn: document.getElementById('val-spawn'),
      sliderSpeed: document.getElementById('slider-speed'),
      valSpeed: document.getElementById('val-speed'),
      selectTheme: document.getElementById('select-theme'),
      checkEnableGlow: document.getElementById('check-enable-glow'),
      checkSnap: document.getElementById('check-snap'),
      checkShowBadge: document.getElementById('check-show-badge'),
      panelNoSel: document.getElementById('no-selection'),
      panelNode: document.getElementById('node-properties'),
      panelEdge: document.getElementById('edge-properties'),
      panelMulti: document.getElementById('multi-selection-properties'),
      multiSelCount: document.getElementById('multi-sel-count'),
      selectNodeShape: document.getElementById('select-node-shape'),
      sliderNodeScale: document.getElementById('slider-node-scale'),
      valNodeScale: document.getElementById('val-node-scale'),
      checkIsGoal: document.getElementById('check-is-goal'),
      inputNodeColor: document.getElementById('input-node-color'),
      checkNodeColor: document.getElementById('check-node-color'),
      btnDeleteNode: document.getElementById('btn-delete-node'),
      btnDeleteMulti: document.getElementById('btn-delete-multi'),
      inputEdgeColor: document.getElementById('input-edge-color'),
      checkEdgeColor: document.getElementById('check-edge-color'),
      btnDeleteEdge: document.getElementById('btn-delete-edge'),
      sliderEdgeSpeed: document.getElementById('slider-edge-speed'),
      valEdgeSpeed: document.getElementById('val-edge-speed'),
      sliderEdgeVolume: document.getElementById('slider-edge-volume'),
      valEdgeVolume: document.getElementById('val-edge-volume'),
      btnSave: document.getElementById('btn-save'),
      btnLoad: document.getElementById('btn-load'),
      fileInput: document.getElementById('file-input'),
      btnScreenshot: document.getElementById('btn-screenshot'),
      btnRecord: document.getElementById('btn-record'),
      inlineEditor: document.getElementById('inline-editor'),
      zoomLevel: document.getElementById('zoom-level'),
      btnZoomIn: document.getElementById('btn-zoom-in'),
      btnZoomOut: document.getElementById('btn-zoom-out'),
      btnZoomReset: document.getElementById('btn-zoom-reset')
    };

    function hexToRgba(hex, alpha) {
      let r = 0, g = 0, b = 0;
      if (hex.length === 4) { r = parseInt(hex[1]+hex[1], 16); g = parseInt(hex[2]+hex[2], 16); b = parseInt(hex[3]+hex[3], 16); }
      else if (hex.length === 7) { r = parseInt(hex[1]+hex[2], 16); g = parseInt(hex[3]+hex[4], 16); b = parseInt(hex[5]+hex[6], 16); }
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function createBackgroundPattern() {
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 40; pCanvas.height = 40;
      const pCtx = pCanvas.getContext('2d');
      pCtx.fillStyle = getColor('bg'); pCtx.fillRect(0, 0, 40, 40);
      pCtx.fillStyle = state.theme === 'dark' ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';
      pCtx.beginPath(); pCtx.arc(0, 0, 1.5, 0, Math.PI * 2); pCtx.fill();
      pCtx.beginPath(); pCtx.arc(20, 20, 1.5, 0, Math.PI * 2); pCtx.fill();
      bgPattern = ctx.createPattern(pCanvas, 'repeat');
    }

    function getScreenPos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function getWorldPos(screenX, screenY) {
      return { x: (screenX - state.panX) / state.zoom, y: (screenY - state.panY) / state.zoom };
    }

    function getScreenFromWorld(worldX, worldY) {
      return { x: (worldX * state.zoom) + state.panX, y: (worldY * state.zoom) + state.panY };
    }

    function measureMultilineText(ctx, text, fontSize) {
      const safeText = String(text || '');
      const lines = safeText.split('\n');
      let maxWidth = 0;
      for (let line of lines) {
        const w = ctx.measureText(line).width;
        if (w > maxWidth) maxWidth = w;
      }
      return { width: maxWidth, height: lines.length * fontSize };
    }

    function drawMultilineText(ctx, text, x, y, fontSize, lineHeightMult = 1.2) {
      const safeText = String(text || '');
      const lines = safeText.split('\n');
      const lineHeight = fontSize * lineHeightMult;
      const totalHeight = lines.length * lineHeight;
      let currentY = y - totalHeight / 2 + lineHeight / 2;
      for (let line of lines) { ctx.fillText(line, x, currentY); currentY += lineHeight; }
    }

    function getNodeSize(node) {
      const scale = node.scale !== undefined ? Number(node.scale) : 1.0;
      ctx.font = '600 13px Inter, sans-serif';
      const textInfo = measureMultilineText(ctx, String(node.name || ''), 13);
      let width, height;
      
      if (node.shape === 'rect') {
        width = Math.max(120, textInfo.width + 40) * scale;
        height = Math.max(46, textInfo.height + 20) * scale;
      } else if (node.shape === 'diamond') {
        width = Math.max(140, textInfo.width + 60) * scale;
        height = Math.max(80, textInfo.height + 40) * scale;
      } else { // circle
        const r = Math.max(35, (Math.max(textInfo.width, textInfo.height) + 20) / 2) * scale;
        width = r * 2; height = r * 2;

      return { width, height, scale };
    }

    function isMouseOnNode(worldX, worldY, node) {
      const size = getNodeSize(node);
      const dx = Math.abs(worldX - node.x);
      const dy = Math.abs(worldY - node.y);
      
      if (node.shape === 'rect') {
        return dx <= size.width/2 && dy <= size.height/2;
      } else if (node.shape === 'diamond') {
        return (dx / (size.width/2) + dy / (size.height/2)) <= 1;
      } else { // circle
        return (dx*dx + dy*dy) <= (size.width/2)*(size.width/2);
      }
    }

    function getNodeIntersection(node, angle) {
      const size = getNodeSize(node);
      const w = size.width / 2; const h = size.height / 2;
      
      if (node.shape === 'rect') {
          const cosA = Math.abs(Math.cos(angle)); const sinA = Math.abs(Math.sin(angle));
          const dist = Math.min(w * sinA > h * cosA ? h / sinA : w / cosA);
          return { x: node.x + dist * Math.cos(angle), y: node.y + dist * Math.sin(angle) };
      } else if (node.shape === 'diamond') {
          const cosA = Math.abs(Math.cos(angle)); const sinA = Math.abs(Math.sin(angle));
          const dist = (w * h) / (h * cosA + w * sinA);
          return { x: node.x + dist * Math.cos(angle), y: node.y + dist * Math.sin(angle) };
      } else {
          return { x: node.x + w * Math.cos(angle), y: node.y + h * Math.sin(angle) };
      }
    }

    function getEdgeCurve(edge) {
      const from = state.nodes.find(n => n.id === edge.from);
      const to = state.nodes.find(n => n.id === edge.to);
      if (!from || !to) return null;

      const isCurved = state.edges.some(e => e !== edge && e.from === edge.to && e.to === edge.from);
      
      let startX, startY, endX, endY, cpX, cpY, arrowAngle;
      const dx = to.x - from.x; const dy = to.y - from.y;
      const len = Math.hypot(dx, dy) || 1;
      
      if (isCurved) {
        const midX = from.x + dx / 2; const midY = from.y + dy / 2;
        const nx = -dy / len; const ny = dx / len;
        const offset = 35;
        cpX = midX + nx * offset; cpY = midY + ny * offset;
        
        const angleFrom = Math.atan2(cpY - from.y, cpX - from.x);
        const posFrom = getNodeIntersection(from, angleFrom);
        startX = posFrom.x; startY = posFrom.y;
        
        const angleToReverse = Math.atan2(cpY - to.y, cpX - to.x);
        const posTo = getNodeIntersection(to, angleToReverse);
        endX = posTo.x; endY = posTo.y;
        
        arrowAngle = Math.atan2(endY - cpY, endX - cpX);
      } else {
        const originalAngle = Math.atan2(dy, dx);
        const posFrom = getNodeIntersection(from, originalAngle);
        startX = posFrom.x; startY = posFrom.y;
        const posTo = getNodeIntersection(to, originalAngle + Math.PI);
        endX = posTo.x; endY = posTo.y;
        cpX = (startX + endX) / 2; cpY = (startY + endY) / 2;
        arrowAngle = originalAngle;
      }
      return { isCurved, startX, startY, cpX, cpY, endX, endY, arrowAngle, len };
    }

    function getDistToSegment(x, y, x1, y1, x2, y2) {
      const A = x - x1; const B = y - y1; const C = x2 - x1; const D = y2 - y1;

      let param = -1; if (len_sq != 0) param = dot / len_sq;
      let xx, yy;
      if (param < 0) { xx = x1; yy = y1; } else if (param > 1) { xx = x2; yy = y2; } else { xx = x1 + param * C; yy = y1 + param * D; }
      const dx = x - xx; const dy = y - yy;

    }

    function getDistToEdge(x, y, edge) {
      const curve = getEdgeCurve(edge);
      if (!curve) return Infinity;
      if (!curve.isCurved) {
        return getDistToSegment(x, y, curve.startX, curve.startY, curve.endX, curve.endY);
      } else {
        let minDist = Infinity;
        let lastX = curve.startX, lastY = curve.startY;
        for (let i = 1; i <= 10; i++) {
          const t = i / 10; const mt = 1 - t;
          const px = mt * mt * curve.startX + 2 * mt * t * curve.cpX + t * t * curve.endX;
          const py = mt * mt * curve.startY + 2 * mt * t * curve.cpY + t * t * curve.endY;
          const d = getDistToSegment(x, y, lastX, lastY, px, py);
          if (d < minDist) minDist = d;
          lastX = px; lastY = py;
        }
        return minDist;
      }
    }

    function getEdgeHandles(edge) {
      const curve = getEdgeCurve(edge);
      if (!curve) return null;
      return { fromHandle: { x: curve.startX, y: curve.startY }, toHandle: { x: curve.endX, y: curve.endY } };
    }

    function getLabelRect(edge) {
      if (!edge.label || String(edge.label).trim() === "") return null;
      const curve = getEdgeCurve(edge);
      if (!curve) return null;
      
      const t = edge.labelPos !== undefined ? edge.labelPos : 0.5;
      let midX, midY;
      
      if (curve.isCurved) {
        const mt = 1 - t;
        midX = mt * mt * curve.startX + 2 * mt * t * curve.cpX + t * t * curve.endX;
        midY = mt * mt * curve.startY + 2 * mt * t * curve.cpY + t * t * curve.endY;
      } else {
        midX = curve.startX + (curve.endX - curve.startX) * t;
        midY = curve.startY + (curve.endY - curve.startY) * t;
      }
      
      ctx.font = '12px Inter, sans-serif';
      const textInfo = measureMultilineText(ctx, String(edge.label), 12);
      return { x: midX - textInfo.width/2 - 8, y: midY - textInfo.height/2 - 8, w: textInfo.width + 16, h: textInfo.height + 16, midX, midY };
    }

    function updateInlineEditorPosition() {
      if (!state.editingTarget || !state.editingType) return;
      const target = state.editingTarget;
      const editor = ui.inlineEditor;
      let w = 100, h = 30, worldPx = 0, worldPy = 0;

      if (state.editingType === 'node') {
        const size = getNodeSize(target);
        w = size.width - 10; h = size.height - 10;
        worldPx = target.x - w/2; worldPy = target.y - h/2;
      } else if (state.editingType === 'edge') {

        } else {
            const curve = getEdgeCurve(target);

              const midX = curve.isCurved ? (mt * mt * curve.startX + 2 * mt * pos * curve.cpX + pos * pos * curve.endX) : (curve.startX + (curve.endX - curve.startX) * pos);
              const midY = curve.isCurved ? (mt * mt * curve.startY + 2 * mt * pos * curve.cpY + pos * pos * curve.endY) : (curve.startY + (curve.endY - curve.startY) * pos);

    function handleMouseDown(e) {

      const x = worldPos.x; const y = worldPos.y;

      const x = worldPos.x; const y = worldPos.y;

        }

        const hoverEdge = state.edges.some(e => getDistToEdge(x, y, e) < 10/state.zoom);

          for (const node of state.nodes) {

              }
            }

        const minY = Math.min(state.boxStartY, state.boxCurrentY); const maxY = Math.max(state.boxStartY, state.boxCurrentY);

        if (state.selectedGroup.length > 1) {
          state.selectedNode = null; state.selectedEdge = null;
          ui.panelNoSel.classList.add('hidden'); ui.panelNode.classList.add('hidden'); ui.panelEdge.classList.add('hidden');
          ui.panelMulti.classList.remove('hidden'); ui.multiSelCount.textContent = state.selectedGroup.length;
        } else if (state.selectedGroup.length === 1) { selectNode(state.selectedGroup[0]); state.selectedGroup = []; }

      }

            const radioBg = document.querySelector(`input[name="bg-drag-mode"][value="${state.bgDragMode}"]`);
            if (radioBg) radioBg.checked = true;
            
            state.isDragging = false; state.draggedNode = null; state.isDraggingLabel = false; state.draggedLabelEdge = null; state.isConnecting = false; state.connectFromNode = null; state.isBoxSelecting = false; state.selectedGroup = [];
            
            updateTheme(); state.signals = []; clearSelection(); state.panX = 0; state.panY = 0; setZoom(1.0);
          }
        } catch (err) { alert("ファイルの読み込みに失敗しました。正しいデータ形式か確認してください。"); }
      };
      reader.readAsText(file); ui.fileInput.value = "";
    }

    function takeScreenshot() {
      if (state.editingTarget) stopInlineEditing(true);
      render(); const dataURL = canvas.toDataURL('image/png'); const a = document.createElement('a');
      a.href = dataURL; a.download = 'cycle_flow_screenshot.png'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    function toggleRecording() {
      if (!state.isRecording) startRecording(); else stopRecording();
    }

    function startRecording() {
      if (state.editingTarget) stopInlineEditing(true);
      const stream = canvas.captureStream(30); let mimeType = 'video/webm';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/mp4'; 
      try { state.mediaRecorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported(mimeType) ? mimeType : '' }); } 
      catch (e) { alert("お使いのブラウザは録画機能に対応していません。"); return; }
      state.recordedChunks = [];
      state.mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) state.recordedChunks.push(e.data); };
      state.mediaRecorder.onstop = function() {
        const blob = new Blob(state.recordedChunks, { type: mimeType }); const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `cycle_flow_movie.${mimeType === 'video/mp4' ? 'mp4' : 'webm'}`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      };
      state.mediaRecorder.start(); state.isRecording = true;
      ui.btnRecord.textContent = '⏹ 録画停止'; ui.btnRecord.classList.replace('btn-secondary', 'btn-danger');
    }

    function loadSampleData() {
      state.nodes = [
        { id: 'n1', x: 250, y: 350, name: '① 入庫', shape: 'circle', scale: 1.0, isGoal: false, errorCount: 0, successCount: 0 },
        { id: 'n2', x: 450, y: 350, name: '② 検品', shape: 'diamond', scale: 1.0, isGoal: false, errorCount: 0, successCount: 0 },
        { id: 'n3', x: 700, y: 200, name: '③ 梱包作業\n(手作業)', shape: 'rect', scale: 1.2, isGoal: false, errorCount: 0, successCount: 0 },
        { id: 'n4', x: 700, y: 500, name: '④ 異常品対応', shape: 'rect', scale: 1.0, isGoal: false, errorCount: 0, successCount: 0, useCustomColor: true, customColor: '#ef4444' },
        { id: 'n5', x: 950, y: 200, name: '⑤ 出荷完了', shape: 'rect', scale: 1.0, isGoal: true, errorCount: 0, successCount: 0 }
      ];
      state.edges = [
        { from: 'n1', to: 'n2', label: '', labelPos: 0.5, speed: 1.0, volume: 1 },
        { from: 'n2', to: 'n3', label: '合格\nルート', labelPos: 0.5, speed: 1.5, volume: 2 },
        { from: 'n2', to: 'n4', label: '不合格', labelPos: 0.5, useCustomColor: true, customColor: '#ef4444', speed: 0.3, volume: 1 },
        { from: 'n3', to: 'n5', label: '', labelPos: 0.5, speed: 1.0, volume: 1 },
        { from: 'n5', to: 'n1', label: 'サイクル戻り', labelPos: 0.5, speed: 1.0, volume: 1 }
      ];
    }

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight;
      createBackgroundPattern(); render();
    }
    
    window.addEventListener('resize', resizeCanvas);
    setupEventListeners(); loadSampleData(); resizeCanvas(); updateTheme();
    
    function staticRenderLoop() {
      if (!state.isRunning) render();
      requestAnimationFrame(staticRenderLoop);
    }
    staticRenderLoop();
  </script>
</body>
</html>
