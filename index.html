<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cycle Flow Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --grid-color: rgba(255, 255, 255, 0.05);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      display: flex;
      height: 100vh;
    }

    #sidebar {
      width: 320px;
      background-color: var(--panel-bg);
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }

    .panel-section {
      padding: 20px;
      border-bottom: 1px solid #334155;
    }

    .panel-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 15px;
      font-weight: 600;
    }

    #canvas-container {
      flex-grow: 1;
      position: relative;
      background-image: 
        radial-gradient(var(--grid-color) 1px, transparent 1px),
        radial-gradient(var(--grid-color) 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary { background-color: var(--accent); color: white; }
    .btn-primary:hover { background-color: var(--accent-hover); }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .btn-danger:hover { background-color: var(--danger); color: white; }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid #475569;
    }
    .btn-secondary:hover { background-color: #334155; }

    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: var(--text-muted);
    }
    .form-group input[type="text"],
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }
    .form-group input[type="text"]:focus,
    .form-group select:focus { border-color: var(--accent); }
    .form-group input[type="range"] { width: 100%; accent-color: var(--accent); }

    .color-picker-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    .color-picker-group input[type="color"] {
      width: 32px; height: 32px; padding: 0; border: none; border-radius: 4px; background: none; cursor: pointer;
    }

    .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; }
    .checkbox-label input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

    .info-box {
      background-color: rgba(59, 130, 246, 0.1);
      border-left: 3px solid var(--accent);
      padding: 10px;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    #inline-editor {
      position: absolute;
      background-color: var(--panel-bg);
      color: white;
      border: 2px solid var(--accent);
      border-radius: 4px;
      padding: 0 5px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      outline: none;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="panel-section" style="padding-bottom: 10px;">
      <h1 class="text-xl font-bold text-white mb-1">Cycle Flow</h1>
      <p class="text-xs text-slate-400">プロセスマイニング・シミュレーター</p>
    </div>

    <!-- 共通設定パネル -->
    <div class="panel-section">
      <div class="info-box">
        <b>操作方法:</b><br>
        ・空白をダブルクリック：拠点追加<br>
        ・<b>拠点をダブルクリック：名前編集</b><br>
        ・<b>Shiftキー ＋ ドラッグ：線で繋ぐ</b><br>
        ・線の上のメモはドラッグで移動可能<br>
        ・クリックしてDelete：削除
      </div>
      
      <button id="btn-toggle-sim" class="btn btn-primary mb-3">
        ▶ シミュレーション開始
      </button>

      <div class="form-group">
        <label>シグナル発生頻度: <span id="val-spawn">中</span></label>
        <input type="range" id="slider-spawn" min="10" max="120" value="60">
      </div>
      <div class="form-group">
        <label>全体の基本速度: <span id="val-speed">1.0x</span></label>
        <input type="range" id="slider-speed" min="0.1" max="5.0" step="0.1" value="1.0">
      </div>

      <div class="form-group" style="margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 4px;">
        <label class="checkbox-label">
          <input type="checkbox" id="check-snap" checked>
          <span>整列アシスト (スマートガイド)</span>
        </label>
        <label class="checkbox-label" style="margin-top: 8px;">
          <input type="checkbox" id="check-show-badge" checked>
          <span>滞留カウント(バッジ)を表示</span>
        </label>
      </div>
    </div>

    <!-- 非選択時 -->
    <div id="no-selection" class="panel-section" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
      拠点 または 線 をクリックすると<br>詳細を設定できます
    </div>

    <!-- 拠点プロパティ -->
    <div id="node-properties" class="panel-section hidden" style="flex-grow: 1;">
      <div class="panel-title">拠点の設定</div>
      <div class="form-group">
        <label>拠点名</label>
        <input type="text" id="input-node-name" placeholder="例: 受注処理">
        <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 5px;">
          ※拠点をダブルクリックでも編集できます
        </div>
      </div>
      <div class="form-group">
        <label>形状</label>
        <select id="select-node-shape">
          <option value="circle">丸 (Circle)</option>
          <option value="rect">四角 (Rectangle)</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>テーマカラー</label>
        <div class="color-picker-group">
          <input type="color" id="input-node-color" value="#ef4444">
          <label class="checkbox-label" style="margin-bottom: 0;">
            <input type="checkbox" id="check-node-color">
            <span style="font-size: 0.85rem;">色を指定する</span>
          </label>
        </div>
      </div>

      <div class="form-group" style="margin-top: 15px; padding: 10px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 4px;">
        <label class="checkbox-label" style="color: var(--success);">
          <input type="checkbox" id="check-is-goal">
          <span class="font-bold">この拠点を「ゴール」にする</span>
        </label>
        <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 5px; margin-left: 24px;">
          行き先がない場合でもエラー警告にならず、正常完了として扱われます。
        </div>
      </div>
      <div style="margin-top: auto; padding-top: 20px;">
        <button id="btn-delete-node" class="btn btn-danger">拠点を削除 (Del)</button>
      </div>
    </div>

    <!-- 繋がり(エッジ)プロパティ -->
    <div id="edge-properties" class="panel-section hidden" style="flex-grow: 1;">
      <div class="panel-title">線の設定</div>
      
      <!-- 流量・速度の個別コントロール -->
      <div class="form-group" style="margin-bottom: 20px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 6px; border: 1px solid #334155;">
        <label>玉の通過速度: <span id="val-edge-speed" style="color: #60a5fa; font-weight: bold;">1.0x</span></label>
        <input type="range" id="slider-edge-speed" min="0.1" max="3.0" step="0.1" value="1.0">
        <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 15px;">※遅くすると渋滞(ボトルネック)を表現できます。</div>
        
        <label>1回の発生量: <span id="val-edge-volume" style="color: #60a5fa; font-weight: bold;">1個</span></label>
        <input type="range" id="slider-edge-volume" min="1" max="10" step="1" value="1">
        <div style="font-size: 0.75rem; color: #94a3b8;">※一度に流れる玉の数（処理ボリューム）</div>
      </div>

      <div class="form-group">
        <label>フローの解説メモ (ラベル)</label>
        <input type="text" id="input-edge-label" placeholder="例: 承認された場合">
        <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 5px;">
          入力したテキストが線の上に表示されます。
        </div>
      </div>

      <div class="form-group">
        <label>テーマカラー</label>
        <div class="color-picker-group">
          <input type="color" id="input-edge-color" value="#ef4444">
          <label class="checkbox-label" style="margin-bottom: 0;">
            <input type="checkbox" id="check-edge-color">
            <span style="font-size: 0.85rem;">色を指定する</span>
          </label>
        </div>
      </div>

      <div style="margin-top: auto; padding-top: 20px;">
        <button id="btn-delete-edge" class="btn btn-danger">この線を削除 (Del)</button>
      </div>
    </div>

    <!-- 保存・読込 -->
    <div class="panel-section" style="display: flex; gap: 10px;">
      <button id="btn-save" class="btn btn-secondary" style="flex: 1; font-size: 0.8rem;">保存</button>
      <button id="btn-load" class="btn btn-secondary" style="flex: 1; font-size: 0.8rem;">読込</button>
      <input type="file" id="file-input" accept=".json" style="display: none;">
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="sim-canvas"></canvas>
    <!-- インラインエディタ -->
    <input type="text" id="inline-editor" class="hidden">
  </div>

  <script>
    const state = {
      nodes: [],
      edges: [],
      signals: [],
      isRunning: false,
      simulationSpeed: 1.0,
      spawnRate: 60,
      frameCount: 0,
      
      selectedNode: null,
      selectedEdge: null,
      isDragging: false,
      draggedNode: null,
      
      isDraggingLabel: false,
      draggedLabelEdge: null,
      
      isConnecting: false,
      connectFromNode: null,
      mouseX: 0,
      mouseY: 0,
      
      enableSnap: true,
      showCountBadge: true,
      alignGuides: [],
      lastTime: 0,

      editingNode: null
    };

    const canvas = document.getElementById('sim-canvas');
    const ctx = canvas.getContext('2d');

    const ui = {
      btnToggle: document.getElementById('btn-toggle-sim'),
      sliderSpawn: document.getElementById('slider-spawn'),
      valSpawn: document.getElementById('val-spawn'),
      sliderSpeed: document.getElementById('slider-speed'),
      valSpeed: document.getElementById('val-speed'),
      checkSnap: document.getElementById('check-snap'),
      checkShowBadge: document.getElementById('check-show-badge'),
      panelNoSel: document.getElementById('no-selection'),
      panelNode: document.getElementById('node-properties'),
      panelEdge: document.getElementById('edge-properties'),
      inputNodeName: document.getElementById('input-node-name'),
      selectNodeShape: document.getElementById('select-node-shape'),
      checkIsGoal: document.getElementById('check-is-goal'),
      inputNodeColor: document.getElementById('input-node-color'),
      checkNodeColor: document.getElementById('check-node-color'),
      btnDeleteNode: document.getElementById('btn-delete-node'),
      inputEdgeLabel: document.getElementById('input-edge-label'),
      inputEdgeColor: document.getElementById('input-edge-color'),
      checkEdgeColor: document.getElementById('check-edge-color'),
      btnDeleteEdge: document.getElementById('btn-delete-edge'),
      btnSave: document.getElementById('btn-save'),
      btnLoad: document.getElementById('btn-load'),
      fileInput: document.getElementById('file-input'),
      inlineEditor: document.getElementById('inline-editor'),
      sliderEdgeSpeed: document.getElementById('slider-edge-speed'),
      valEdgeSpeed: document.getElementById('val-edge-speed'),
      sliderEdgeVolume: document.getElementById('slider-edge-volume'),
      valEdgeVolume: document.getElementById('val-edge-volume')
    };

    function hexToRgba(hex, alpha) {
      let r = 0, g = 0, b = 0;
      if (hex.length === 4) {
        r = parseInt(hex[1] + hex[1], 16); g = parseInt(hex[2] + hex[2], 16); b = parseInt(hex[3] + hex[3], 16);
      } else if (hex.length === 7) {
        r = parseInt(hex[1] + hex[2], 16); g = parseInt(hex[3] + hex[4], 16); b = parseInt(hex[5] + hex[6], 16);
      }
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function loadSampleData() {
      state.nodes = [
        { id: 'n1', x: 150, y: 300, name: '① 入庫', shape: 'circle', isGoal: false, errorCount: 0, successCount: 0 },
        { id: 'n2', x: 350, y: 300, name: '② 検品', shape: 'circle', isGoal: false, errorCount: 0, successCount: 0 },
        { id: 'n3', x: 600, y: 150, name: '③ 梱包作業', shape: 'rect', isGoal: false, errorCount: 0, successCount: 0 },
        { id: 'n4', x: 600, y: 450, name: '④ 異常品対応', shape: 'rect', isGoal: false, errorCount: 0, successCount: 0, useCustomColor: true, customColor: '#ef4444' },
        { id: 'n5', x: 850, y: 150, name: '⑤ 出荷完了', shape: 'rect', isGoal: true, errorCount: 0, successCount: 0 }
      ];
      state.edges = [
        { from: 'n1', to: 'n2', label: '', labelPos: 0.5, speed: 1.0, volume: 1 },
        { from: 'n2', to: 'n3', label: '合格', labelPos: 0.5, speed: 1.5, volume: 2 },
        { from: 'n2', to: 'n4', label: '不合格', labelPos: 0.5, useCustomColor: true, customColor: '#ef4444', speed: 0.3, volume: 1 },
        { from: 'n3', to: 'n5', label: '', labelPos: 0.5, speed: 1.0, volume: 1 },
        { from: 'n5', to: 'n1', label: 'サイクル戻り', labelPos: 0.5, speed: 1.0, volume: 1 }
      ];
    }

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function setupEventListeners() {
      ui.btnToggle.addEventListener('click', toggleSimulation);
      
      ui.sliderSpawn.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        state.spawnRate = 130 - val;
        let text = '中';
        if (val < 40) text = '低 (ゆっくり)';
        if (val > 90) text = '高 (激しい)';
        ui.valSpawn.textContent = text;
      });
      
      ui.sliderSpeed.addEventListener('input', (e) => {
        state.simulationSpeed = parseFloat(e.target.value);
        ui.valSpeed.textContent = `${state.simulationSpeed.toFixed(1)}x`;
      });
      
      ui.checkSnap.addEventListener('change', (e) => state.enableSnap = e.target.checked);
      ui.checkShowBadge.addEventListener('change', (e) => state.showCountBadge = e.target.checked);
      
      ui.inputNodeName.addEventListener('input', (e) => { if (state.selectedNode) state.selectedNode.name = e.target.value; });
      ui.selectNodeShape.addEventListener('change', (e) => { if (state.selectedNode) state.selectedNode.shape = e.target.value; });
      ui.checkIsGoal.addEventListener('change', (e) => { if (state.selectedNode) state.selectedNode.isGoal = e.target.checked; });
      ui.inputNodeColor.addEventListener('input', (e) => { if (state.selectedNode) state.selectedNode.customColor = e.target.value; });
      ui.checkNodeColor.addEventListener('change', (e) => { if (state.selectedNode) state.selectedNode.useCustomColor = e.target.checked; });
      ui.btnDeleteNode.addEventListener('click', deleteSelectedNode);
      
      ui.inputEdgeLabel.addEventListener('input', (e) => { if (state.selectedEdge) state.selectedEdge.label = e.target.value; });
      ui.inputEdgeColor.addEventListener('input', (e) => { if (state.selectedEdge) state.selectedEdge.customColor = e.target.value; });
      ui.checkEdgeColor.addEventListener('change', (e) => { if (state.selectedEdge) state.selectedEdge.useCustomColor = e.target.checked; });
      ui.btnDeleteEdge.addEventListener('click', deleteSelectedEdge);
      
      ui.sliderEdgeSpeed.addEventListener('input', (e) => { 
        if (state.selectedEdge) {
          state.selectedEdge.speed = parseFloat(e.target.value); 
          ui.valEdgeSpeed.textContent = `${state.selectedEdge.speed.toFixed(1)}x`;
        }
      });
      ui.sliderEdgeVolume.addEventListener('input', (e) => { 
        if (state.selectedEdge) {
          state.selectedEdge.volume = parseInt(e.target.value); 
          ui.valEdgeVolume.textContent = `${state.selectedEdge.volume}個`;
        }
      });

      ui.btnSave.addEventListener('click', saveToFile);
      ui.btnLoad.addEventListener('click', () => ui.fileInput.click());
      ui.fileInput.addEventListener('change', loadFromFile);

      canvas.addEventListener('mousedown', handleMouseDown);
      canvas.addEventListener('mousemove', handleMouseMove);
      canvas.addEventListener('mouseup', handleMouseUp);
      canvas.addEventListener('dblclick', handleDoubleClick);
      
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Delete' || e.key === 'Backspace') {
          if (document.activeElement.tagName !== 'INPUT') {
            if (state.selectedNode) deleteSelectedNode();
            if (state.selectedEdge) deleteSelectedEdge();
          }
        }
      });

      ui.inlineEditor.addEventListener('blur', () => stopInlineEditing(true));
      ui.inlineEditor.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          ui.inlineEditor.blur(); 
        } else if (e.key === 'Escape') {
          stopInlineEditing(false); 
        }
      });
    }

    function startInlineEditing(node) {
      state.editingNode = node;
      const editor = ui.inlineEditor;

      let w = 100;
      const h = 30;
      if (node.shape === 'rect') {
        const size = getRectSize(node);
        w = size.width - 20; 
      } else {
        w = 60; 
      }

      editor.style.left = `${node.x - w/2}px`;
      editor.style.top = `${node.y - h/2}px`;
      editor.style.width = `${w}px`;
      editor.style.height = `${h}px`;

      editor.value = node.name;
      editor.classList.remove('hidden');
      editor.focus();
      editor.select(); 
    }

    function stopInlineEditing(save = true) {
      if (!state.editingNode) return;
      
      if (save) {
        const newName = ui.inlineEditor.value.trim() || '名称未設定';
        state.editingNode.name = newName;
        if (state.selectedNode === state.editingNode) {
          ui.inputNodeName.value = newName;
        }
      }

      ui.inlineEditor.classList.add('hidden');
      state.editingNode = null;
      render();
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function getRectSize(node) {
      ctx.font = '600 13px Inter, sans-serif';
      const textWidth = ctx.measureText(node.name).width;
      const width = Math.max(100, textWidth + 30);
      return { width, height: 46 };
    }

    function isMouseOnNode(x, y, node) {
      if (node.shape === 'rect') {
        const { width, height } = getRectSize(node);
        return x >= node.x - width/2 && x <= node.x + width/2 &&
               y >= node.y - height/2 && y <= node.y + height/2;
      } else {
        const radius = 35;
        const dx = x - node.x;
        const dy = y - node.y;
        return (dx * dx + dy * dy) <= (radius * radius);
      }
    }

    function getLabelRect(edge) {
      if (!edge.label || edge.label.trim() === "") return null;
      const from = state.nodes.find(n => n.id === edge.from);
      const to = state.nodes.find(n => n.id === edge.to);
      if (!from || !to) return null;
      
      const pos = edge.labelPos !== undefined ? edge.labelPos : 0.5;
      const midX = from.x + (to.x - from.x) * pos;
      const midY = from.y + (to.y - from.y) * pos;
      
      ctx.font = '12px Inter, sans-serif';
      const textWidth = ctx.measureText(edge.label).width;
      
      return {
        x: midX - textWidth/2 - 6,
        y: midY - 12,
        w: textWidth + 12,
        h: 24,
        midX, midY
      };
    }

    function getDistToSegment(x, y, x1, y1, x2, y2) {
      const A = x - x1; const B = y - y1;
      const C = x2 - x1; const D = y2 - y1;
      const dot = A * C + B * D;
      const len_sq = C * C + D * D;
      let param = -1;
      if (len_sq != 0) param = dot / len_sq;
      let xx, yy;
      if (param < 0) { xx = x1; yy = y1; }
      else if (param > 1) { xx = x2; yy = y2; }
      else { xx = x1 + param * C; yy = y1 + param * D; }
      const dx = x - xx; const dy = y - yy;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function handleMouseDown(e) {
      const { x, y } = getMousePos(e);
      
      let clickedLabelEdge = null;
      for (const edge of state.edges) {
        const rect = getLabelRect(edge);
        if (rect) {
          if (x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h) {
            clickedLabelEdge = edge;
            break;
          }
        }
      }

      if (clickedLabelEdge) {
        selectEdge(clickedLabelEdge);
        state.isDraggingLabel = true;
        state.draggedLabelEdge = clickedLabelEdge;
        canvas.style.cursor = 'grabbing';
        return;
      }

      let clickedNode = null;
      for (let i = state.nodes.length - 1; i >= 0; i--) {
        if (isMouseOnNode(x, y, state.nodes[i])) {
          clickedNode = state.nodes[i];
          break;
        }
      }

      if (clickedNode) {
        if (e.shiftKey) {
          state.isConnecting = true;
          state.connectFromNode = clickedNode;
        } else {
          selectNode(clickedNode);
          state.isDragging = true;
          state.draggedNode = clickedNode;
          canvas.style.cursor = 'grabbing';
        }
        return;
      }

      let clickedEdge = null;
      for (const edge of state.edges) {
        const from = state.nodes.find(n => n.id === edge.from);
        const to = state.nodes.find(n => n.id === edge.to);
        if (from && to) {
          const dist = getDistToSegment(x, y, from.x, from.y, to.x, to.y);
          if (dist < 10) {
            clickedEdge = edge;
            break;
          }
        }
      }

      if (clickedEdge) {
        selectEdge(clickedEdge);
        return;
      }
      
      clearSelection();
    }

    function handleMouseMove(e) {
      const { x, y } = getMousePos(e);
      state.mouseX = x; 
      state.mouseY = y;

      if (state.isDraggingLabel && state.draggedLabelEdge) {
        const from = state.nodes.find(n => n.id === state.draggedLabelEdge.from);
        const to = state.nodes.find(n => n.id === state.draggedLabelEdge.to);
        if (from && to) {
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          const lenSq = dx * dx + dy * dy;
          if (lenSq > 0) {
            let t = ((x - from.x) * dx + (y - from.y) * dy) / lenSq;
            t = Math.max(0.1, Math.min(0.9, t));
            state.draggedLabelEdge.labelPos = t;
          }
        }
        return;
      }

      if (!state.isDragging && !state.isDraggingLabel) {
        const hoverNode = state.nodes.some(n => isMouseOnNode(x, y, n));
        const hoverLabel = state.edges.some(e => {
          const r = getLabelRect(e);
          return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
        });
        canvas.style.cursor = (hoverNode || hoverLabel) ? 'pointer' : 'crosshair';
      }

      if (state.isDragging && state.draggedNode) {
        let newX = x; 
        let newY = y;
        state.alignGuides = [];
        
        if (state.enableSnap) {
          const SNAP_DIST = 15;
          let snapX = null; let minDistX = SNAP_DIST;
          let snapY = null; let minDistY = SNAP_DIST;
          let snapAngle = null; let minDistAngle = SNAP_DIST;
          
          for (const node of state.nodes) {
            if (node.id === state.draggedNode.id) continue;
            
            if (Math.abs(newX - node.x) < minDistX) { minDistX = Math.abs(newX - node.x); snapX = node.x; }
            if (Math.abs(newY - node.y) < minDistY) { minDistY = Math.abs(newY - node.y); snapY = node.y; }
            
            const diagAngles = [30, 45, 60, 120, 135, 150];
            for(const ang of diagAngles) {
              const rad = ang * Math.PI / 180;
              const dx = newX - node.x;
              const dy = newY - node.y;
              const dist = Math.abs(dx * (-Math.sin(rad)) + dy * Math.cos(rad));
              
              if (dist < minDistAngle) {
                minDistAngle = dist;
                const t = dx * Math.cos(rad) + dy * Math.sin(rad);
                snapAngle = {
                  x: node.x + t * Math.cos(rad),
                  y: node.y + t * Math.sin(rad),
                  guideStartX: node.x - 2000 * Math.cos(rad),
                  guideStartY: node.y - 2000 * Math.sin(rad),
                  guideEndX: node.x + 2000 * Math.cos(rad),
                  guideEndY: node.y + 2000 * Math.sin(rad)
                };
              }
            }
          }
          
          if (snapX !== null || snapY !== null) {
            if (snapX !== null) { newX = snapX; state.alignGuides.push({ type: 'x', x: snapX, y1: newY - 1000, y2: newY + 1000 }); }
            if (snapY !== null) { newY = snapY; state.alignGuides.push({ type: 'y', y: snapY, x1: newX - 1000, x2: newX + 1000 }); }
          } else if (snapAngle !== null) {
            newX = snapAngle.x; newY = snapAngle.y;
            state.alignGuides.push({ type: 'line', x1: snapAngle.guideStartX, y1: snapAngle.guideStartY, x2: snapAngle.guideEndX, y2: snapAngle.guideEndY });
          }
        }
        
        state.draggedNode.x = newX;
        state.draggedNode.y = newY;
      }
    }

    function handleMouseUp(e) {
      if (state.isConnecting && state.connectFromNode) {
        const { x, y } = getMousePos(e);
        let targetNode = null;
        
        for (const node of state.nodes) {
          if (isMouseOnNode(x, y, node) && node.id !== state.connectFromNode.id) {
            targetNode = node;
            break;
          }
        }
        
        if (targetNode) {
          const exists = state.edges.some(edge => edge.from === state.connectFromNode.id && edge.to === targetNode.id);
          if (!exists) {
            state.edges.push({ 
              from: state.connectFromNode.id, 
              to: targetNode.id, 
              label: '', 
              labelPos: 0.5,
              useCustomColor: false,
              customColor: '#ef4444',
              speed: 1.0,
              volume: 1
            });
          }
        }
      }
      
      state.isDragging = false;
      state.draggedNode = null;
      state.isDraggingLabel = false;
      state.draggedLabelEdge = null;
      state.isConnecting = false;
      state.connectFromNode = null;
      state.alignGuides = [];
      canvas.style.cursor = 'crosshair';
    }

    function handleDoubleClick(e) {
      const { x, y } = getMousePos(e);
      const clickedNode = state.nodes.find(node => isMouseOnNode(x, y, node));
      
      if (clickedNode) {
        selectNode(clickedNode);
        startInlineEditing(clickedNode);
      } else {
        const newNode = {
          id: 'node_' + Date.now(),
          x: x, y: y,
          name: '新規拠点',
          shape: 'rect',
          isGoal: false,
          errorCount: 0, 
          successCount: 0,
          useCustomColor: false,
          customColor: '#ef4444'
        };
        state.nodes.push(newNode);
        selectNode(newNode);
        startInlineEditing(newNode);
      }
    }

    function selectNode(node) {
      state.selectedNode = node; 
      state.selectedEdge = null;
      ui.panelNoSel.classList.add('hidden'); 
      ui.panelEdge.classList.add('hidden'); 
      ui.panelNode.classList.remove('hidden');
      
      ui.inputNodeName.value = node.name;
      ui.selectNodeShape.value = node.shape || 'circle';
      ui.checkIsGoal.checked = node.isGoal || false;
      ui.checkNodeColor.checked = node.useCustomColor || false;
      ui.inputNodeColor.value = node.customColor || '#ef4444';
    }

    function selectEdge(edge) {
      state.selectedEdge = edge; 
      state.selectedNode = null;
      ui.panelNoSel.classList.add('hidden'); 
      ui.panelNode.classList.add('hidden'); 
      ui.panelEdge.classList.remove('hidden');
      
      ui.inputEdgeLabel.value = edge.label || '';
      ui.checkEdgeColor.checked = edge.useCustomColor || false;
      ui.inputEdgeColor.value = edge.customColor || '#ef4444';

      ui.sliderEdgeSpeed.value = edge.speed !== undefined ? edge.speed : 1.0;
      ui.valEdgeSpeed.textContent = `${(edge.speed !== undefined ? edge.speed : 1.0).toFixed(1)}x`;
      
      ui.sliderEdgeVolume.value = edge.volume !== undefined ? edge.volume : 1;
      ui.valEdgeVolume.textContent = `${(edge.volume !== undefined ? edge.volume : 1)}個`;
    }

    function clearSelection() {
      state.selectedNode = null; 
      state.selectedEdge = null;
      ui.panelNode.classList.add('hidden'); 
      ui.panelEdge.classList.add('hidden'); 
      ui.panelNoSel.classList.remove('hidden');
    }

    function deleteSelectedNode() {
      if (!state.selectedNode) return;
      const id = state.selectedNode.id;
      state.nodes = state.nodes.filter(n => n.id !== id);
      state.edges = state.edges.filter(e => e.from !== id && e.to !== id);
      state.signals = state.signals.filter(s => s.fromId !== id && s.toId !== id);
      clearSelection();
    }

    function deleteSelectedEdge() {
      if (!state.selectedEdge) return;
      state.edges = state.edges.filter(e => e !== state.selectedEdge);
      clearSelection();
    }

    function drawNode(node) {
      const isEditing = (node === state.editingNode);

      ctx.save();
      const isSelected = state.selectedNode === node;
      const hasOutgoing = state.edges.some(e => e.from === node.id);
      
      const isError = !hasOutgoing && !node.isGoal;
      const isSuccess = (!hasOutgoing && node.isGoal) || (node.isGoal && node.successCount > 0);

      let nodeStrokeColor = '#475569';
      let glowColor = null;

      if (isSelected) {
        nodeStrokeColor = '#3b82f6';
        glowColor = 'rgba(59, 130, 246, 0.8)';
      } else if (node.useCustomColor && node.customColor) {
        nodeStrokeColor = node.customColor;
        glowColor = hexToRgba(node.customColor, 0.8);
      } else if (isError && node.errorCount > 0) {
        nodeStrokeColor = '#ef4444';
        glowColor = 'rgba(239, 68, 68, 0.9)';
      } else if (isSuccess) {
        nodeStrokeColor = '#10b981';
        if (node.successCount > 0) glowColor = 'rgba(16, 185, 129, 0.6)';
      }

      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;

      if (glowColor) {
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 15;
      }

      ctx.fillStyle = '#334155'; 
      ctx.strokeStyle = nodeStrokeColor;
      ctx.lineWidth = (isSelected || glowColor) ? 3 : 2;

      if (node.shape === 'rect') {
        const { width, height } = getRectSize(node);
        const r = 8;
        const x = node.x - width/2;
        const y = node.y - height/2;
        ctx.beginPath();
        ctx.moveTo(x + r, y); ctx.lineTo(x + width - r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.lineTo(x + width, y + height - r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.lineTo(x + r, y + height);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
      } else {
        const radius = 35;
        ctx.beginPath();
        ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }

      ctx.shadowBlur = 0;
      
      if (!isEditing) {
        ctx.fillStyle = 'white';
        ctx.font = '600 13px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        let displayName = node.name;
        if (node.shape !== 'rect' && displayName.length > 8) displayName = displayName.substring(0, 7) + '..';
        ctx.fillText(displayName, node.x, node.y);
      }

      if (state.showCountBadge) {
        if (isError && node.errorCount > 0) drawBadge(node, node.errorCount, '#ef4444');
        else if (isSuccess && node.successCount > 0) drawBadge(node, node.successCount, '#10b981');
      }
      
      ctx.restore();
    }

    function drawBadge(node, count, color) {
      const offsetX = node.shape === 'rect' ? getRectSize(node).width/2 - 10 : 25;
      const offsetY = node.shape === 'rect' ? -getRectSize(node).height/2 + 5 : -25;
      
      ctx.beginPath();
      ctx.arc(node.x + offsetX, node.y + offsetY, 12, 0, Math.PI*2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText(count > 99 ? '99+' : count, node.x + offsetX, node.y + offsetY);
    }

    function drawEdge(edge) {
      const from = state.nodes.find(n => n.id === edge.from);
      const to = state.nodes.find(n => n.id === edge.to);
      if (!from || !to) return;

      ctx.save();
      const isSelected = state.selectedEdge === edge;
      const isDragged = state.draggedLabelEdge === edge;
      
      let edgeColor = 'rgba(148, 163, 184, 0.4)';
      if (isSelected) {
        edgeColor = '#3b82f6';
      } else if (edge.useCustomColor && edge.customColor) {
        edgeColor = hexToRgba(edge.customColor, 0.9);
      }

      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.strokeStyle = edgeColor;
      ctx.lineWidth = isSelected ? 3 : 2;
      ctx.stroke();

      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      let offset = 40;
      if (to.shape === 'rect') {
        const tw = getRectSize(to).width / 2;
        const th = getRectSize(to).height / 2;
        const cosA = Math.abs(Math.cos(angle));
        const sinA = Math.abs(Math.sin(angle));
        if (tw * sinA > th * cosA) offset = th / sinA;
        else offset = tw / cosA;
        offset = Math.min(offset + 10, 80);
      }
      
      const arrowX = to.x - Math.cos(angle) * offset;
      const arrowY = to.y - Math.sin(angle) * offset;
      
      ctx.beginPath();
      ctx.moveTo(arrowX, arrowY);
      ctx.lineTo(arrowX - 10 * Math.cos(angle - Math.PI/6), arrowY - 10 * Math.sin(angle - Math.PI/6));
      ctx.lineTo(arrowX - 10 * Math.cos(angle + Math.PI/6), arrowY - 10 * Math.sin(angle + Math.PI/6));
      ctx.closePath();
      ctx.fillStyle = edgeColor;
      ctx.fill();

      const rect = getLabelRect(edge);
      if (rect) {
        let isGlowing = false;
        const pos = edge.labelPos !== undefined ? edge.labelPos : 0.5;
        const edgeLen = Math.max(Math.hypot(to.x - from.x, to.y - from.y), 1);
        
        for (const sig of state.signals) {
          if (sig.fromId === edge.from && sig.toId === edge.to) {
            const hitRange = 25 / edgeLen; 
            if (Math.abs(sig.progress - pos) < hitRange) {
              isGlowing = true;
              break;
            }
          }
        }

        ctx.fillStyle = isGlowing ? '#1e293b' : 'rgba(15, 23, 42, 0.85)';
        
        if (isGlowing) {
          ctx.shadowColor = '#60a5fa'; 
          ctx.shadowBlur = 12;
          ctx.strokeStyle = '#60a5fa';
        } else {
          ctx.shadowBlur = isDragged ? 8 : 0;
          ctx.shadowColor = 'rgba(0,0,0,0.5)';
          ctx.strokeStyle = isSelected ? '#3b82f6' : '#475569';
        }

        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        ctx.lineWidth = (isGlowing || isSelected) ? 2 : 1;
        ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
        
        ctx.shadowBlur = 0; 
        ctx.fillStyle = isGlowing ? '#93c5fd' : (isSelected ? '#ffffff' : '#94a3b8');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(edge.label, rect.midX, rect.midY);
      }
      ctx.restore();
    }

    function drawConnectingLine() {
      if (!state.isConnecting || !state.connectFromNode) return;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(state.connectFromNode.x, state.connectFromNode.y);
      ctx.lineTo(state.mouseX, state.mouseY);
      ctx.strokeStyle = 'rgba(59, 130, 246, 0.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.stroke();
      ctx.restore();
    }

    function drawAlignGuides() {
      if (!state.alignGuides || state.alignGuides.length === 0) return;
      ctx.save();
      ctx.strokeStyle = '#f472b6'; 
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
      
      for (const guide of state.alignGuides) {
        ctx.beginPath();
        if (guide.type === 'x') {
          ctx.moveTo(guide.x, guide.y1); ctx.lineTo(guide.x, guide.y2);
        } else if (guide.type === 'y') {
          ctx.moveTo(guide.x1, guide.y); ctx.lineTo(guide.x2, guide.y);
        } else if (guide.type === 'line') { 
          ctx.moveTo(guide.x1, guide.y1); ctx.lineTo(guide.x2, guide.y2);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function toggleSimulation() {
      state.isRunning = !state.isRunning;
      if (state.isRunning) {
        ui.btnToggle.textContent = '■ シミュレーション停止';
        ui.btnToggle.classList.replace('btn-primary', 'btn-danger');
        state.signals = [];
        state.nodes.forEach(n => { n.errorCount = 0; n.successCount = 0; });
        state.frameCount = 0;
        state.lastTime = performance.now();
        requestAnimationFrame(simulationLoop);
      } else {
        ui.btnToggle.textContent = '▶ シミュレーション開始';
        ui.btnToggle.classList.replace('btn-danger', 'btn-primary');
      }
    }

    function spawnSignal(startNode) {
      if (state.signals.length > 500) return;
      const outgoingEdges = state.edges.filter(e => e.from === startNode.id);
      if (outgoingEdges.length === 0) return;
      
      outgoingEdges.forEach(edge => {
        const vol = edge.volume !== undefined ? edge.volume : 1;
        const spd = edge.speed !== undefined ? edge.speed : 1.0;
        
        for (let k = 0; k < vol; k++) {
          state.signals.push({ 
            fromId: edge.from, 
            toId: edge.to, 
            progress: 0, 
            speed: (0.005 + Math.random() * 0.002) * spd
          });
        }
      });
    }

    function simulationLoop(timestamp) {
      if (!state.isRunning) return;
      
      let deltaTime = timestamp - state.lastTime;
      if (deltaTime > 100) deltaTime = 16;
      state.lastTime = timestamp;
      
      const timeScale = (deltaTime / 16.6) * state.simulationSpeed;

      state.frameCount += timeScale;
      if (state.frameCount >= state.spawnRate) {
        state.frameCount = 0;
        const startNodes = state.nodes.filter(n => !state.edges.some(e => e.to === n.id));
        if (startNodes.length === 0 && state.nodes.length > 0) {
          spawnSignal(state.nodes[0]); 
        } else {
          startNodes.forEach(node => spawnSignal(node));
        }
      }

      for (let i = state.signals.length - 1; i >= 0; i--) {
        const sig = state.signals[i];
        sig.progress += sig.speed * timeScale;
        
        if (sig.progress >= 1.0) {
          const toNode = state.nodes.find(n => n.id === sig.toId);
          if (toNode) {
            const nextEdges = state.edges.filter(e => e.from === toNode.id);
            if (nextEdges.length > 0) {
              nextEdges.forEach(edge => {
                const vol = edge.volume !== undefined ? edge.volume : 1;
                const spd = edge.speed !== undefined ? edge.speed : 1.0;
                for (let k = 0; k < vol; k++) {
                  state.signals.push({ 
                    fromId: edge.from, 
                    toId: edge.to, 
                    progress: 0, 
                    speed: (0.005 + Math.random() * 0.002) * spd 
                  });
                }
              });
            } else {
              if (toNode.isGoal) toNode.successCount++;
              else toNode.errorCount++;
            }
          }
          state.signals.splice(i, 1);
        }
      }
      
      render();
      requestAnimationFrame(simulationLoop);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      state.edges.forEach(edge => drawEdge(edge));
      drawConnectingLine();
      drawAlignGuides();

      ctx.shadowBlur = 15; 
      ctx.shadowColor = '#60a5fa'; 
      ctx.fillStyle = '#eff6ff';
      state.signals.forEach(sig => {
        const from = state.nodes.find(n => n.id === sig.fromId);
        const to = state.nodes.find(n => n.id === sig.toId);
        if (from && to) {
          const currentX = from.x + (to.x - from.x) * sig.progress;
          const currentY = from.y + (to.y - from.y) * sig.progress;
          ctx.beginPath(); 
          ctx.arc(currentX, currentY, 5, 0, Math.PI * 2); 
          ctx.fill();
        }
      });
      ctx.shadowBlur = 0;
      
      state.nodes.forEach(node => drawNode(node));
    }

    function saveToFile() {
      const saveData = {
        nodes: state.nodes,
        edges: state.edges,
        settings: { 
          spawnRate: state.spawnRate, 
          simulationSpeed: state.simulationSpeed,
          enableSnap: state.enableSnap,
          showCountBadge: state.showCountBadge
        }
      };
      
      const jsonStr = JSON.stringify(saveData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.href = url; 
      downloadAnchorNode.download = "cycle_flow_data.json";
      document.body.appendChild(downloadAnchorNode); 
      downloadAnchorNode.click();
      document.body.removeChild(downloadAnchorNode); 
      URL.revokeObjectURL(url);
    }

    function loadFromFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const contents = JSON.parse(e.target.result);
          if (contents.nodes && contents.edges) {
            state.nodes = contents.nodes.map(n => ({ 
              ...n, shape: n.shape || 'circle', isGoal: n.isGoal || false, errorCount: 0, successCount: 0,
              useCustomColor: n.useCustomColor || false, customColor: n.customColor || '#ef4444'
            }));
            
            state.edges = contents.edges.map(e => ({ 
              ...e, label: e.label || '', labelPos: e.labelPos !== undefined ? e.labelPos : 0.5,
              useCustomColor: e.useCustomColor || false, customColor: e.customColor || '#ef4444',
              speed: e.speed !== undefined ? e.speed : 1.0,
              volume: e.volume !== undefined ? e.volume : 1
            }));
            
            if (contents.settings) {
              if (contents.settings.spawnRate) state.spawnRate = contents.settings.spawnRate;
              if (contents.settings.simulationSpeed) state.simulationSpeed = contents.settings.simulationSpeed;
              if (contents.settings.enableSnap !== undefined) state.enableSnap = contents.settings.enableSnap;
              if (contents.settings.showCountBadge !== undefined) state.showCountBadge = contents.settings.showCountBadge;
              
              ui.sliderSpeed.value = state.simulationSpeed;
              ui.valSpeed.textContent = `${state.simulationSpeed.toFixed(1)}x`;
              
              const spawnVal = 130 - state.spawnRate;
              ui.sliderSpawn.value = spawnVal;
              let text = '中';
              if (spawnVal < 40) text = '低 (ゆっくり)';
              if (spawnVal > 90) text = '高 (激しい)';
              ui.valSpawn.textContent = text;
              
              ui.checkSnap.checked = state.enableSnap;
              ui.checkShowBadge.checked = state.showCountBadge;
            }
            
            state.signals = []; 
            clearSelection(); 
            render();
          }
        } catch (err) {
          alert("ファイルの読み込みに失敗しました。正しいデータ形式か確認してください。");
        }
      };
      reader.readAsText(file);
      ui.fileInput.value = "";
    }

    setupEventListeners();
    loadSampleData();
    render();
    
    function staticRenderLoop() {
      if (!state.isRunning) render();
      requestAnimationFrame(staticRenderLoop);
    }
    staticRenderLoop();
  </script>
</body>
</html>
